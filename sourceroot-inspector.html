<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SourceRoot Inspector Prototype</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f4ee;
      color: #1f2933;
      margin: 0;
    }

    header {
      background: #111827;
      color: white;
      padding: 24px;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    .subtitle {
      color: #d1d5db;
      margin-top: 8px;
    }

    main {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 20px;
      max-width: 1300px;
      margin: 0 auto;
      padding: 24px;
    }

    .panel {
      background: white;
      border: 1px solid #ddd6c8;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .node-card {
      border: 1px solid #ddd6c8;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      background: #fff;
    }

    .node-card:hover,
    .node-card.active {
      background: #fff8e6;
      border-color: #b78a2f;
    }

    .meta {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .hub-label {
      display: inline-block;
      background: #111827;
      color: white;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 11px;
      margin-bottom: 8px;
    }

    .tag {
      display: inline-block;
      background: #efe7d3;
      color: #4b3b16;
      padding: 5px 8px;
      border-radius: 999px;
      font-size: 12px;
      margin: 3px 4px 3px 0;
    }

    code {
      background: #eee;
      padding: 2px 5px;
      border-radius: 4px;
    }

    .section {
      margin-top: 24px;
      padding-top: 14px;
      border-top: 1px solid #ddd6c8;
    }

    .empty {
      color: #6b7280;
      font-style: italic;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #cfc7b8;
      margin-bottom: 14px;
      font-size: 14px;
      box-sizing: border-box;
    }

    @media (max-width: 800px) {
      main {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>SourceRoot Inspector</h1>
    <div class="subtitle">
      Master prototype view for SourceRoot: DictionaryHub + BibleRoot through one adapter layer.
    </div>
  </header>

  <main>
    <section class="panel">
      <h2>Universal Nodes</h2>
      <input id="searchInput" type="text" placeholder="Search SourceRoot..." />
      <div id="nodeCount" class="meta"></div>
      <div id="nodeList"></div>
    </section>

    <section class="panel">
      <div id="inspector">
        <h2>Select a node</h2>
        <p class="empty">Click a node on the left to inspect its assertions, relationships, sources, and revisions.</p>
      </div>
    </section>
  </main>

  <script type="module">
    import { adaptDictionaryConcepts } from "./engine/adapters/dictionaryAdapter.js";
    import { adaptBibleNodes } from "./engine/adapters/bibleAdapter.js";
    import { combineNodes, searchNodes } from "./engine/sourceRootEngine.js";

    let allNodes = [];
    let allEdges = [];
    let allAssertions = [];
    let allSources = [];
    let selectedNodeId = null;

    async function loadSourceRootInspector() {
      try {
        const [
          bibleNodesResponse,
          bibleEdgesResponse,
          bibleAssertionsResponse,
          bibleSourcesResponse,
          dictionaryConceptsResponse
        ] = await Promise.all([
          fetch("data/bible-root-nodes.json"),
          fetch("data/bible-root-edges.json"),
          fetch("data/bible-root-assertions.json"),
          fetch("data/bible-root-sources.json"),
          fetch("data/nodes-v2-root.json")
        ]);

        const bibleNodesRaw = await bibleNodesResponse.json();
        const bibleEdgesRaw = await bibleEdgesResponse.json();
        const bibleAssertionsRaw = await bibleAssertionsResponse.json();
        const bibleSourcesRaw = await bibleSourcesResponse.json();
        const dictionaryConceptsRaw = await dictionaryConceptsResponse.json();

        const bibleNodes = adaptBibleNodes(bibleNodesRaw);
        const dictionaryNodes = adaptDictionaryConcepts(dictionaryConceptsRaw);

        allNodes = combineNodes(bibleNodes, dictionaryNodes);

        allEdges = [
          ...adaptBibleEdges(bibleEdgesRaw),
          ...adaptDictionaryEdges(dictionaryConceptsRaw)
        ];

        allAssertions = [
          ...adaptBibleAssertions(bibleAssertionsRaw),
          ...adaptDictionaryAssertions(dictionaryConceptsRaw)
        ];

        allSources = bibleSourcesRaw;

        renderNodeList(allNodes);

        document.getElementById("searchInput").addEventListener("input", event => {
          const filteredNodes = searchNodes(allNodes, event.target.value);
          renderNodeList(filteredNodes);
        });

      } catch (error) {
        document.getElementById("nodeList").innerHTML =
          "<p class='empty'>Could not load SourceRoot data.</p>";
        console.error(error);
      }
    }

    function adaptBibleEdges(edges = []) {
      return edges.map(edge => ({
        ...edge,
        fromNodeId: `bible-${edge.fromNodeId}`,
        toNodeId: `bible-${edge.toNodeId}`,
        domain: "BibleRoot"
      }));
    }

    function adaptBibleAssertions(assertions = []) {
      return assertions.map(assertion => ({
        ...assertion,
        nodeId: `bible-${assertion.nodeId}`,
        domain: "BibleRoot"
      }));
    }

    function adaptDictionaryEdges(concepts = []) {
      const edges = [];

      concepts.forEach(concept => {
        (concept.relationships || []).forEach((relationship, index) => {
          edges.push({
            id: `dictionary-edge-${concept.id}-${relationship.target}-${index}`,
            fromNodeId: `dictionary-${concept.id}`,
            toNodeId: `dictionary-${relationship.target}`,
            relationshipType: relationship.type || "RELATED_TO",
            label: relationship.direction || relationship.type || "related to",
            summary: relationship.explanation || "",
            sourceIds: relationship.sourceIds || [],
            domain: "DictionaryHub"
          });
        });
      });

      return edges;
    }

    function adaptDictionaryAssertions(concepts = []) {
      const assertions = [];

      concepts.forEach(concept => {
        if (concept.shortDefinition) {
          assertions.push({
            id: `dictionary-assertion-${concept.id}-short-definition`,
            nodeId: `dictionary-${concept.id}`,
            assertionType: "short-definition",
            label: "Short Definition",
            summary: concept.shortDefinition,
            body: concept.shortDefinition,
            sourceIds: concept.sourceIds || [],
            confidence: "working",
            status: concept.status || "v2-draft",
            domain: "DictionaryHub"
          });
        }

        if (concept.fullDefinition) {
          assertions.push({
            id: `dictionary-assertion-${concept.id}-full-definition`,
            nodeId: `dictionary-${concept.id}`,
            assertionType: "full-definition",
            label: "Full Definition",
            summary: concept.shortDefinition || "",
            body: concept.fullDefinition,
            sourceIds: concept.sourceIds || [],
            confidence: "working",
            status: concept.status || "v2-draft",
            domain: "DictionaryHub"
          });
        }

        if (concept.plainEnglish) {
          assertions.push({
            id: `dictionary-assertion-${concept.id}-plain-english`,
            nodeId: `dictionary-${concept.id}`,
            assertionType: "plain-english",
            label: "Plain English",
            summary: concept.plainEnglish,
            body: concept.plainEnglish,
            sourceIds: concept.sourceIds || [],
            confidence: "working",
            status: concept.status || "v2-draft",
            domain: "DictionaryHub"
          });
        }

        if (concept.whyItMatters) {
          assertions.push({
            id: `dictionary-assertion-${concept.id}-why-it-matters`,
            nodeId: `dictionary-${concept.id}`,
            assertionType: "why-it-matters",
            label: "Why It Matters",
            summary: concept.whyItMatters,
            body: concept.whyItMatters,
            sourceIds: concept.sourceIds || [],
            confidence: "working",
            status: concept.status || "v2-draft",
            domain: "DictionaryHub"
          });
        }
      });

      return assertions;
    }

    function renderNodeList(nodes) {
      const nodeList = document.getElementById("nodeList");
      const nodeCount = document.getElementById("nodeCount");

      nodeCount.textContent = `${nodes.length} nodes loaded`;

      nodeList.innerHTML = nodes.map(node => `
        <div 
          class="node-card ${node.id === selectedNodeId ? "active" : ""}" 
          onclick="window.selectNode('${node.id}')"
        >
          <span class="hub-label">${node.domain}</span>
          <strong>${node.title}</strong>
          <div class="meta">${node.type}</div>
          <div>${node.summary || ""}</div>
        </div>
      `).join("");
    }

    window.selectNode = function(nodeId) {
      selectedNodeId = nodeId;

      const selectedNode = allNodes.find(node => node.id === nodeId);
      const nodeAssertions = allAssertions.filter(assertion => assertion.nodeId === nodeId);

      const outgoingEdges = allEdges.filter(edge => edge.fromNodeId === nodeId);
      const incomingEdges = allEdges.filter(edge => edge.toNodeId === nodeId);

      const currentSearch = document.getElementById("searchInput").value;
      renderNodeList(searchNodes(allNodes, currentSearch));
      renderInspector(selectedNode, nodeAssertions, outgoingEdges, incomingEdges);
    };

    function renderInspector(node, assertions, outgoingEdges, incomingEdges) {
      const inspector = document.getElementById("inspector");

      if (!node) {
        inspector.innerHTML = `<p class="empty">Node not found.</p>`;
        return;
      }

      const sourceIds = new Set([
        ...(node.sourceIds || []),
        ...assertions.flatMap(assertion => assertion.sourceIds || []),
        ...outgoingEdges.flatMap(edge => edge.sourceIds || []),
        ...incomingEdges.flatMap(edge => edge.sourceIds || [])
      ]);

      const matchingSources = allSources.filter(source => sourceIds.has(source.id));

      inspector.innerHTML = `
        <span class="hub-label">${node.domain}</span>
        <h2>${node.title}</h2>
        <div class="meta">${node.type}</div>

        <p><strong>Summary:</strong> ${node.summary || ""}</p>
        <p>${node.description || ""}</p>

        <p><strong>Node ID:</strong> <code>${node.id}</code></p>

        <div class="section">
          <h3>Assertions</h3>
          ${assertions.length ? assertions.map(assertion => `
            <article>
              <h4>${assertion.label}</h4>
              <div class="meta">${assertion.assertionType} · ${assertion.status || "working"} · ${assertion.confidence || "working"}</div>
              <p><strong>Summary:</strong> ${assertion.summary || ""}</p>
              <p>${assertion.body || ""}</p>
              <p><strong>Source IDs:</strong> ${(assertion.sourceIds || []).map(id => `<code>${id}</code>`).join(" ")}</p>
            </article>
          `).join("") : `<p class="empty">No assertions yet.</p>`}
        </div>

        <div class="section">
          <h3>Outgoing Relationships</h3>
          ${outgoingEdges.length ? outgoingEdges.map(edge => {
            const targetNode = allNodes.find(node => node.id === edge.toNodeId);
            return `
              <p>
                <code>${node.title}</code>
                ${edge.label}
                <code>${targetNode ? targetNode.title : edge.toNodeId}</code>
              </p>
              <p>${edge.summary || ""}</p>
            `;
          }).join("") : `<p class="empty">No outgoing relationships yet.</p>`}
        </div>

        <div class="section">
          <h3>Incoming Relationships</h3>
          ${incomingEdges.length ? incomingEdges.map(edge => {
            const sourceNode = allNodes.find(node => node.id === edge.fromNodeId);
            return `
              <p>
                <code>${sourceNode ? sourceNode.title : edge.fromNodeId}</code>
                ${edge.label}
                <code>${node.title}</code>
              </p>
              <p>${edge.summary || ""}</p>
            `;
          }).join("") : `<p class="empty">No incoming relationships yet.</p>`}
        </div>

        <div class="section">
          <h3>Sources</h3>
          ${matchingSources.length ? matchingSources.map(source => `
            <article>
              <h4>${source.name}</h4>
              <div class="meta">${source.type} · ${source.qualityTier}</div>
              <p>${source.notes}</p>
              ${source.url ? `<p><a href="${source.url}" target="_blank" rel="noopener">Open source</a></p>` : ""}
            </article>
          `).join("") : `<p class="empty">Sources referenced by ID. Full DictionaryHub source registry connection comes next.</p>`}
        </div>

        <div class="section">
          <h3>Revisions</h3>
          ${(node.revisions || []).length ? node.revisions.map(revision => `
            <p><strong>${revision.version}</strong> — ${revision.summary || revision.note || ""}</p>
          `).join("") : `<p class="empty">No revisions yet.</p>`}
        </div>
      `;
    }

    loadSourceRootInspector();
  </script>
</body>
</html>
